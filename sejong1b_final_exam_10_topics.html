  });

  groups.forEach((g,gi)=>{
    const nums=g.items.map(v=>v.i+1);
    const range=nums.length===1?`Câu ${nums[0]}`:`Câu ${nums[0]}~${nums[nums.length-1]}`;
    h+=`<div class="card">
      <div class="qno">🎧 Nhóm nghe ${gi+1} · ${range}</div>
      <div class="vi" style="margin:6px 0 10px">Nghe file này rồi trả lời ${g.items.length} câu hỏi bên dưới.</div>
      <audio controls preload="none" src="${encodeURI(g.audio)}"></audio>`;

    g.items.forEach(({x,i})=>{
      let k='l'+i;
      h+=`<div style="border-top:1px solid var(--line);padding-top:16px;margin-top:16px">
        <div class="qno">Câu ${i+1}</div>
        <div class="q">${esc(x.q)}</div>`;
      if(x.kind==='visual'){
        h+=`<div class="visuals">`+x.opts.map((o,j)=>`<button class="visual ${state[k]==j?'sel':''}" onclick="setVal('${k}',${j});renderListen()"><span>${o[0]}</span><small>Hình ${j+1}</small></button>`).join('')+`</div>`;
      }else{
        h+=`<div class="choices">`+x.choices.map((o,j)=>`<label class="choice"><input type="radio" name="${k}" ${state[k]==j?'checked':''} onchange="setVal('${k}',${j})"><span>${j+1}. ${esc(o)}</span></label>`).join('')+`</div>`;
      }
      h+=`</div>`;
    });
    h+=`</div>`;
  });

  h+=`<div class="actions"><button class="btn primary" onclick="checkListen()">Chấm điểm nghe</button><button class="btn ghost" onclick="resetSec('l')">Làm lại</button></div><div id="lres"></div>`;
  document.getElementById('listen').innerHTML=h;
}
function checkListen(){let n=0;DATA.listening.forEach((x,i)=>{let ans=x.kind==='visual'?x.ans:x.answer;if(Number(state['l'+i])===ans)n++});document.getElementById('lres').innerHTML=`<div class="result">NGHE: ${n} / 15</div>`}
function renderRead(){let h=`<div class="sectiontitle"><h2>PHẦN THI ĐỌC · 15 Câu</h2><div>${timerHTML(25,'r')}</div></div><p class="vi">1~3 điền chỗ trống · 4~6 chọn câu trả lời · 7~8 chọn chủ đề · 9~15 đọc đoạn văn và trả lời.</p>`;DATA.reading.forEach((x,i)=>{let k='r'+i;h+=`<div class="card"><div class="qno">Câu ${i+1}</div>${x.passage?`<div class="passage">${esc(x.passage)}</div>`:''}<div class="q">${esc(x.question)}</div><div class="choices">`+x.choices.map((o,j)=>`<label class="choice"><input type="radio" name="${k}" ${state[k]==j?'checked':''} onchange="setVal('${k}',${j})"><span>${j+1}. ${esc(o)}</span></label>`).join('')+`</div></div>`});h+=`<div class="actions"><button class="btn primary" onclick="checkRead()">Chấm điểm đọc</button><button class="btn ghost" onclick="resetSec('r')">Làm lại</button></div><div id="rres"></div>`;document.getElementById('read').innerHTML=h}
function checkRead(){let n=0;DATA.reading.forEach((x,i)=>{if(Number(state['r'+i])===Number(x.answer))n++});document.getElementById('rres').innerHTML=`<div class="result">ĐỌC: ${n} / 15</div>`}
function resetSec(p){Object.keys(state).filter(k=>k.startsWith(p)).forEach(k=>delete state[k]);save();renderAll()}function renderAll(){renderWrite();renderListen();renderRead()}document.getElementById('setnav').innerHTML=ALL.map((x,i)=>{const n=i+1;return `<a href="?set=${n}" style="text-decoration:none;padding:8px 12px;border-radius:999px;background:${n===SET?'white':'#ffffff33'};color:${n===SET?'#264f74':'white'};font-weight:900">Đề ${n} · ${x.topic_vi}</a>`}).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.getElementById('setnav').innerHTML=ALL.map((x,i)=>{const n=i+1;return `<a href="?set=${n}" style="text-decoration:none;padding:8px 12px;border-radius:999px;background:${n===SET?'white':'#ffffff33'};color:${n===SET?'#264f74':'white'};font-weight:900">Đề ${n} · ${x.topic_vi}</a>`}).join('');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.getElementById('setnav').innerHTML=ALL.map((x,i)=>{const n=i+1;return `<a href="?set=${n}" style="text-decoration:none;padding:8px 12px;border-radius:999px;background:${n===SET?'white':'#ffffff33'};color:${n===SET?'#264f74':'white'};font-weight:900">Đề ${n} · ${x.topic_vi}</a>`}).join('');renderAll();</script></body></html>
