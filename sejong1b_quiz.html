<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>세종한국어 1B 객관식 퀴즈</title>
  <style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#151922;
  --muted:#667085;
  --line:#e6e9ef;
  --primary:#3558e8;
  --primary-dark:#2746c6;
  --good:#137a43;
  --good-bg:#eaf8f0;
  --bad:#b42318;
  --bad-bg:#fff0ee;
  --shadow:0 14px 40px rgba(23,35,79,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  background:var(--bg);
  color:var(--text);
}
button{font:inherit}
.wrap{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:32px 0 48px}
.hero{
  display:flex;justify-content:space-between;gap:24px;align-items:center;
  padding:28px 30px;margin-bottom:20px;border-radius:26px;
  background:linear-gradient(135deg,#ffffff 0%,#f0f4ff 100%);
  box-shadow:var(--shadow);
}
.eyebrow{margin:0 0 7px;font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--primary)}
h1{margin:0;font-size:clamp(28px,5vw,48px);line-height:1.08}
.sub{margin:12px 0 0;color:var(--muted);font-size:16px}
.hero-badge{
  flex:0 0 auto;width:116px;height:116px;border-radius:28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--primary);color:#fff;box-shadow:0 12px 28px rgba(53,88,232,.28)
}
.hero-badge strong{font-size:34px}.hero-badge span{font-size:13px;opacity:.88}
.panel{background:var(--card);border-radius:26px;padding:28px;box-shadow:var(--shadow)}
.hidden{display:none!important}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.section-head h2{margin:0 0 6px;font-size:24px}.section-head p{margin:0;color:var(--muted)}
.lesson-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lesson-card{
  border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff;
  cursor:pointer;text-align:left;transition:.18s transform,.18s box-shadow,.18s border-color;
}
.lesson-card:hover{transform:translateY(-2px);border-color:#c8d1ff;box-shadow:0 10px 22px rgba(30,50,110,.08)}
.lesson-card .num{display:inline-flex;min-width:38px;height:38px;padding:0 10px;align-items:center;justify-content:center;border-radius:12px;background:#eef2ff;color:var(--primary);font-weight:800}
.lesson-card h3{margin:12px 0 7px;font-size:17px}.lesson-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.lesson-card .saved{margin-top:12px;font-size:12px;font-weight:700;color:var(--good)}
.all-review{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  margin-top:22px;padding:20px;border-radius:18px;background:#f7f9ff;border:1px solid #dde4ff
}
.all-review div{display:flex;flex-direction:column;gap:3px}.all-review span{color:var(--muted);font-size:14px}
.btn{
  border:0;border-radius:13px;padding:11px 16px;font-weight:750;cursor:pointer;
  transition:.18s transform,.18s opacity,.18s background;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-ghost{background:#f2f4f7;color:#344054}.btn-ghost:hover{background:#e9edf3}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.progress-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;color:var(--muted)}
#quizTitle{color:var(--text);font-weight:800}
.progress-track{height:9px;background:#edf0f5;border-radius:999px;overflow:hidden;margin:18px 0 26px}
.progress-bar{height:100%;width:0;background:var(--primary);border-radius:inherit;transition:.25s width}
.question-card{max-width:800px;margin:0 auto}
.question-number{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:8px}
.question-card h2{font-size:clamp(22px,3.5vw,31px);line-height:1.4;margin:0 0 22px}
.choices{display:grid;gap:11px}
.choice{
  width:100%;text-align:left;padding:15px 16px;border-radius:15px;background:#fff;
  border:1.5px solid var(--line);cursor:pointer;font-weight:650;color:#222;
}
.choice:hover:not(:disabled){border-color:#aebcff;background:#f8f9ff}
.choice.correct{border-color:#6bc394;background:var(--good-bg);color:var(--good)}
.choice.wrong{border-color:#e99891;background:var(--bad-bg);color:var(--bad)}
.choice:disabled{cursor:default}
.feedback{margin-top:18px;border-radius:15px;padding:15px 16px}
.feedback.good{background:var(--good-bg);color:var(--good)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback p{margin:6px 0 0;line-height:1.55}
.question-actions{display:flex;justify-content:flex-end;margin-top:20px}
.result-card{text-align:center;max-width:560px;margin:0 auto;padding:14px 0}
.result-card h2{font-size:30px;margin:4px 0 22px}
.score-ring{
  width:190px;height:190px;border-radius:50%;margin:0 auto 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#f2f5ff;border:12px solid #dfe6ff
}
.score-ring strong{font-size:38px}.score-ring span{font-size:14px;color:var(--muted);margin-top:4px}
#resultMessage{color:var(--muted);font-size:16px;line-height:1.6}
.result-actions{display:flex;justify-content:center;gap:10px;margin-top:22px}
footer{padding:18px 4px 0;text-align:center;color:var(--muted);font-size:12px}
@media (max-width:820px){
  .lesson-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .wrap{width:min(100% - 18px,1080px);padding-top:12px}
  .hero{padding:22px 18px;border-radius:20px;align-items:flex-start}
  .hero-badge{width:82px;height:82px;border-radius:20px}.hero-badge strong{font-size:26px}
  .panel{padding:18px;border-radius:20px}
  .section-head{align-items:flex-start;flex-direction:column}
  .lesson-grid{grid-template-columns:1fr}
  .all-review{align-items:flex-start;flex-direction:column}
  .all-review .btn{width:100%}
  .quiz-top{align-items:flex-start}
  .progress-meta{align-items:flex-end}
  .question-actions .btn{width:100%}
  .result-actions{flex-direction:column}
  .result-actions .btn{width:100%}
}

</style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div>
        <p class="eyebrow">SEJONG KOREAN 1B</p>
        <h1>1과~12과 객관식 퀴즈</h1>
        <p class="sub">교재 핵심 문법·단어·표현을 과별 10문제씩 연습하세요.</p>
      </div>
      <div class="hero-badge">
        <strong id="totalQuestions">120</strong>
        <span>총 문제</span>
      </div>
    </header>

    <section id="homeView" class="panel">
      <div class="section-head">
        <div>
          <h2>과를 선택하세요</h2>
          <p>정답을 고르면 즉시 결과와 해설을 확인할 수 있습니다.</p>
        </div>
        <button id="resetProgressBtn" class="btn btn-ghost" type="button">진도 초기화</button>
      </div>

      <div id="lessonGrid" class="lesson-grid"></div>

      <div class="all-review">
        <div>
          <strong>전체 복습</strong>
          <span>1~12과 문제를 섞어서 풀기</span>
        </div>
        <button id="startAllBtn" class="btn btn-primary" type="button">전체 복습 시작</button>
      </div>
    </section>

    <section id="quizView" class="panel hidden">
      <div class="quiz-top">
        <button id="backBtn" class="btn btn-ghost" type="button">← 과 선택</button>
        <div class="progress-meta">
          <span id="quizTitle"></span>
          <span id="progressText"></span>
        </div>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <article class="question-card">
        <div class="question-number" id="questionNumber"></div>
        <h2 id="questionText"></h2>
        <div id="choices" class="choices"></div>

        <div id="feedback" class="feedback hidden" aria-live="polite">
          <strong id="feedbackTitle"></strong>
          <p id="feedbackText"></p>
        </div>

        <div class="question-actions">
          <button id="nextBtn" class="btn btn-primary" type="button" disabled>다음 문제</button>
        </div>
      </article>
    </section>

    <section id="resultView" class="panel hidden">
      <div class="result-card">
        <p class="eyebrow">RESULT</p>
        <h2 id="resultTitle">결과</h2>
        <div class="score-ring">
          <strong id="scoreText"></strong>
          <span id="scorePercent"></span>
        </div>
        <p id="resultMessage"></p>
        <div class="result-actions">
          <button id="retryBtn" class="btn btn-primary" type="button">다시 풀기</button>
          <button id="resultHomeBtn" class="btn btn-ghost" type="button">과 선택으로</button>
        </div>
      </div>
    </section>

    <footer>
      <p>브라우저에 진도가 자동 저장됩니다. GitHub Pages에서 바로 실행할 수 있는 정적 웹앱입니다.</p>
    </footer>
  </main>

            "많이 늦었으니까 죄송해요.",
            "많이 늦게에게 죄송해요.",
            "많이 늦은 후에니까 죄송해요."
          ],
          "answer": 0,
          "explanation": "감사·사과 표현에는 -(으)니까보다 -아서/어서가 자연스럽다고 설명해요."
        }
      ]
    }
  ]
};

</script>
  <script>
(() => {
  const data = window.QUIZ_DATA;
  const $ = (id) => document.getElementById(id);

  const homeView = $("homeView");
  const quizView = $("quizView");
  const resultView = $("resultView");
  const lessonGrid = $("lessonGrid");
  const totalQuestions = $("totalQuestions");
  const quizTitle = $("quizTitle");
  const progressText = $("progressText");
  const progressBar = $("progressBar");
  const questionNumber = $("questionNumber");
  const questionText = $("questionText");
  const choices = $("choices");
  const feedback = $("feedback");
  const feedbackTitle = $("feedbackTitle");
  const feedbackText = $("feedbackText");
  const nextBtn = $("nextBtn");
  const scoreText = $("scoreText");
  const scorePercent = $("scorePercent");
  const resultTitle = $("resultTitle");
  const resultMessage = $("resultMessage");

  let currentMode = "lesson";
  let currentLessonId = null;
  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let locked = false;

  totalQuestions.textContent = data.questionCount;

  const storageKey = "sejong1b-quiz-progress-v1";

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(storageKey) || "{}"); }
    catch { return {}; }
  }

  function saveProgress(key, value) {
    const progress = loadProgress();
    progress[key] = value;
    localStorage.setItem(storageKey, JSON.stringify(progress));
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderLessons() {
    const progress = loadProgress();
    lessonGrid.innerHTML = "";
    data.lessons.forEach((lesson) => {
      const saved = progress["lesson-" + lesson.id];
      const card = document.createElement("button");
      card.className = "lesson-card";
      card.type = "button";
      card.innerHTML = `
        <span class="num">${lesson.id}과</span>
        <h3>${lesson.title.replace(/^\d+과 · /, "")}</h3>
        <p>${lesson.topic}</p>
        <div class="saved">${saved ? `최근 점수 ${saved.score}/${saved.total}` : "10문제"}</div>
      `;
      card.addEventListener("click", () => startLesson(lesson.id));
      lessonGrid.appendChild(card);
    });
  }

  function setView(view) {
    homeView.classList.toggle("hidden", view !== "home");
    quizView.classList.toggle("hidden", view !== "quiz");
    resultView.classList.toggle("hidden", view !== "result");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function startLesson(id) {
    const lesson = data.lessons.find(l => l.id === id);
    currentMode = "lesson";
    currentLessonId = id;
    currentQuestions = lesson.questions.map(x => ({...x}));
    currentIndex = 0;
    score = 0;
    quizTitle.textContent = lesson.title;
    setView("quiz");
    renderQuestion();
  }

  function startAll() {
    currentMode = "all";
    currentLessonId = null;
    currentQuestions = shuffle(
      data.lessons.flatMap(lesson =>
        lesson.questions.map(q => ({...q, lessonId: lesson.id}))
      )
    );
    currentIndex = 0;
    score = 0;
    quizTitle.textContent = "전체 복습 · 1과~12과";
    setView("quiz");
    renderQuestion();
  }

  function renderQuestion() {
    locked = false;
    nextBtn.disabled = true;
    feedback.className = "feedback hidden";
    choices.innerHTML = "";

    const item = currentQuestions[currentIndex];
    const total = currentQuestions.length;
    questionNumber.textContent = currentMode === "all" && item.lessonId
      ? `${item.lessonId}과 · 문제 ${currentIndex + 1}`
      : `문제 ${currentIndex + 1}`;
    questionText.textContent = item.question;
    progressText.textContent = `${currentIndex + 1} / ${total}`;
    progressBar.style.width = `${((currentIndex + 1) / total) * 100}%`;

    item.choices.forEach((choiceText, index) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.textContent = `${index + 1}. ${choiceText}`;
      btn.addEventListener("click", () => chooseAnswer(index, btn));
      choices.appendChild(btn);
    });

    nextBtn.textContent = currentIndex === total - 1 ? "결과 보기" : "다음 문제";
  }

  function chooseAnswer(index, clickedButton) {
    if (locked) return;
    locked = true;

    const item = currentQuestions[currentIndex];
    const buttons = [...choices.querySelectorAll(".choice")];
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === item.answer) btn.classList.add("correct");
    });

    const correct = index === item.answer;
    if (!correct) clickedButton.classList.add("wrong");
    if (correct) score++;

    feedback.classList.remove("hidden");
    feedback.classList.add(correct ? "good" : "bad");
    feedbackTitle.textContent = correct ? "정답입니다!" : `정답은 ${item.answer + 1}번입니다.`;
    feedbackText.textContent = item.explanation;
    nextBtn.disabled = false;
  }

  function nextQuestion() {
    if (!locked) return;
    if (currentIndex < currentQuestions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    const total = currentQuestions.length;
    const pct = Math.round((score / total) * 100);
    scoreText.textContent = `${score} / ${total}`;
    scorePercent.textContent = `${pct}점`;
    resultTitle.textContent = currentMode === "lesson"
      ? `${currentLessonId}과 완료`
      : "전체 복습 완료";

    if (pct >= 90) resultMessage.textContent = "아주 잘했어요. 핵심 표현을 거의 정확하게 익혔습니다.";
    else if (pct >= 70) resultMessage.textContent = "잘했어요. 틀린 문제의 해설을 다시 확인하면 더 좋아집니다.";
    else if (pct >= 50) resultMessage.textContent = "조금만 더 복습해 보세요. 같은 과를 다시 풀면 금방 익숙해집니다.";
    else resultMessage.textContent = "교재의 핵심 문법과 단어를 한 번 더 보고 다시 도전해 보세요.";

    if (currentMode === "lesson") {
      saveProgress("lesson-" + currentLessonId, {
        score, total, updatedAt: new Date().toISOString()
      });
    } else {
      saveProgress("all", {
        score, total, updatedAt: new Date().toISOString()
      });
    }
    renderLessons();
    setView("result");
  }

  $("startAllBtn").addEventListener("click", startAll);
  $("backBtn").addEventListener("click", () => setView("home"));
  $("resultHomeBtn").addEventListener("click", () => setView("home"));
  nextBtn.addEventListener("click", nextQuestion);
  $("retryBtn").addEventListener("click", () => {
    if (currentMode === "lesson") startLesson(currentLessonId);
    else startAll();
  });
  $("resetProgressBtn").addEventListener("click", () => {
    if (confirm("저장된 점수를 모두 초기화할까요?")) {
      localStorage.removeItem(storageKey);
      renderLessons();
    }
  });

  renderLessons();
})();

</script>
</body>
</html>
