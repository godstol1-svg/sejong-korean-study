const STORE='sejong1b-mp3-exact-v2';
let current=1,state={answers:{},checks:{},notes:{},plays:{},chosen:{}};
try{state={...state,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){localStorage.setItem(STORE,JSON.stringify(state));updateProgress()}
function key(u,t,i){return `u${u}t${t}i${i}`}
function viInstruction(t){return t.type==='numbered'?'Nghe đúng nội dung trong MP3 và ghi lại ý chính cho từng số.':t.type==='qa'?'Nghe hội thoại và trả lời các câu hỏi lấy trực tiếp từ nội dung MP3.':t.type==='fillqa'?'Nghe lại và hoàn thành phần trả lời trong hội thoại.':t.type==='shadow'?'Nghe lại từng câu và đọc theo.':'Nghe phần phát âm và chọn 가 hoặc 나. Phần phát âm không chấm đúng/sai tự động để tránh tạo đáp án sai.'}
function render(){
 $('#tabs').innerHTML=DATA.map(u=>`<button class="tab ${u.unit===1?'active':''}" data-unit="${u.unit}">${u.unit}과 ${esc(u.title)}<small>${esc(u.title_vi)}</small></button>`).join('');
 $('#app').innerHTML=DATA.map(u=>`<section class="unit ${u.unit===1?'active':''}" id="unit-${u.unit}"><div class="unit-head"><h2 class="unit-title">${u.unit}과 · ${esc(u.title)}<small>${esc(u.title_vi)}</small></h2><div class="progress" id="progress-${u.unit}"></div></div>${u.tracks.map(t=>renderTrack(u,t)).join('')}<div class="bottom-nav"><button data-jump="${u.unit-1}" ${u.unit===1?'disabled':''}>◀ 이전 과 · Bài trước</button><button data-jump="${u.unit+1}" ${u.unit===12?'disabled':''}>다음 과 · Bài sau ▶</button></div></section>`).join('')+`<div class="footer">답안과 메모는 이 휴대폰/브라우저에 자동 저장됩니다. · Câu trả lời và ghi chú được tự động lưu.</div>`;
 bind();restore();goUnit(1,false);updateProgress();
}
function renderTrack(u,t){
 const id=`u${u.unit}t${t.no}`; let body='';
 if(t.type==='numbered') body=t.items.map((x,i)=>`<div class="item"><div class="label">${i+1}번 · Số ${i+1}</div><input class="answer-input" data-answer="${key(u.unit,t.no,i)}" placeholder="들은 내용을 적으세요 · Viết nội dung nghe được"><div class="answer-reveal" id="ans-${key(u.unit,t.no,i)}">정답/대본: ${esc(x)}</div></div>`).join('');
 if(t.type==='qa') body=t.qa.map((x,i)=>`<div class="qa-row"><div class="label">${i+1}. ${esc(x.q)}</div><input class="answer-input" data-answer="${key(u.unit,t.no,i)}" placeholder="답을 적으세요 · Viết câu trả lời"><div class="answer-reveal" id="ans-${key(u.unit,t.no,i)}">MP3 내용: ${esc(x.a)}</div></div>`).join('');
 if(t.type==='fillqa') body=t.qa.map((x,i)=>`<div class="fill-row"><div class="label">${esc(x.q)}</div><input class="answer-input" data-answer="${key(u.unit,t.no,i)}" placeholder="대화를 완성하세요 · Hoàn thành hội thoại"><div class="answer-reveal" id="ans-${key(u.unit,t.no,i)}">${esc(x.a)}</div></div>`).join('');
 if(t.type==='shadow') body=`<div class="shadow-list">${t.lines.map((x,i)=>`<label class="shadow"><input type="checkbox" data-shadow="${key(u.unit,t.no,i)}"><span>${esc(x)}</span></label>`).join('')}</div>`;
 if(t.type==='pron') body=t.items.map((x,i)=>`<div class="pron-row"><div class="label">${i+1}번 · Số ${i+1}</div><div class="choice-ab"><label><input type="radio" name="${id}p${i}" value="가" data-pron="${key(u.unit,t.no,i)}">가</label><label><input type="radio" name="${id}p${i}" value="나" data-pron="${key(u.unit,t.no,i)}">나</label></div><div class="answer-reveal" id="ans-${key(u.unit,t.no,i)}">MP3 발음 항목: ${esc(x)}</div></div>`).join('');
 const source=t.type==='pron'?`<div class="danger-note">발음 5번은 음성에서 가/나의 발음 차이를 들어야 하는 문제라, 잘못된 정답을 만들지 않기 위해 자동 정답 판정을 하지 않습니다. · Phần phát âm không tự chấm đúng/sai.</div>`:`<div class="source-note">임의의 객관식 보기를 만들지 않았습니다. 정답 확인 시 MP3에서 확인한 실제 내용을 보여 줍니다. · Không có đáp án trắc nghiệm tự tạo.</div>`;
 const btn=t.type==='shadow'?`<button class="check" data-check="${id}">따라 읽기 완료 · Đã đọc theo</button>`:`<button class="check" data-check="${id}">정답 확인 · Kiểm tra</button>`;
 return `<article class="track" id="${id}" data-unit="${u.unit}" data-track="${t.no}"><div class="track-head"><div class="badge">${t.no}</div><div><h3 class="instruction">${esc(t.instruction)}</h3><p class="vi">${esc(viInstruction(t))}</p></div></div>${source}<div class="audio-box"><audio controls preload="metadata" src="${encodeURI(t.audio)}" data-audio="${id}"></audio><div class="audio-tools"><button class="speed on" data-speed="1">1×</button><button class="speed" data-speed=".8">0.8×</button><button class="speed" data-speed=".65">0.65×</button><span class="plays" id="plays-${id}">재생 0회 · 0 lần</span></div></div>${body}<div class="buttons">${btn}<button class="clear" data-clear="${id}">이 문제 지우기<small>Xóa câu này</small></button></div><div class="done" id="done-${id}">확인했습니다 · Đã kiểm tra</div><details><summary>전체 대본 보기 · Xem toàn bộ lời thoại</summary><ol class="script">${t.transcript.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details><div class="notes"><textarea data-note="${id}" placeholder="메모 · Ghi chú"></textarea></div></article>`;
}
function bind(){
 $$('.tab').forEach(b=>b.onclick=()=>goUnit(Number(b.dataset.unit)));
 $('#prevUnit').onclick=()=>goUnit(Math.max(1,current-1)); $('#nextUnit').onclick=()=>goUnit(Math.min(12,current+1));
 $$('[data-jump]').forEach(b=>b.onclick=()=>{if(!b.disabled)goUnit(Number(b.dataset.jump))});
 $$('[data-answer]').forEach(x=>{x.oninput=()=>{state.answers[x.dataset.answer]=x.value;save()}});
 $$('[data-shadow]').forEach(x=>{x.onchange=()=>{state.checks[x.dataset.shadow]=x.checked;save()}});
 $$('[data-pron]').forEach(x=>{x.onchange=()=>{state.chosen[x.dataset.pron]=x.value;save()}});
 $$('[data-note]').forEach(x=>x.oninput=()=>{state.notes[x.dataset.note]=x.value;save()});
 $$('audio').forEach(a=>{a.onplay=()=>{let id=a.dataset.audio;state.plays[id]=(state.plays[id]||0)+1;save();document.getElementById('plays-'+id).textContent=`재생 ${state.plays[id]}회 · ${state.plays[id]} lần`}});
 $$('.speed').forEach(b=>b.onclick=()=>{let box=b.closest('.audio-box'),a=box.querySelector('audio');a.playbackRate=Number(b.dataset.speed);box.querySelectorAll('.speed').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
 $$('[data-check]').forEach(b=>b.onclick=()=>{let id=b.dataset.check,art=document.getElementById(id);art.querySelectorAll('.answer-reveal').forEach(x=>x.classList.add('show'));document.getElementById('done-'+id).classList.add('show')});
 $$('[data-clear]').forEach(b=>b.onclick=()=>clearTrack(b.dataset.clear));
}
function goUnit(n,scroll=true){current=n;$$('.unit').forEach(x=>x.classList.toggle('active',x.id===`unit-${n}`));$$('.tab').forEach(x=>x.classList.toggle('active',Number(x.dataset.unit)===n));$('#prevUnit').disabled=n===1;$('#nextUnit').disabled=n===12;let active=$(`.tab[data-unit="${n}"]`);if(active)active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});if(scroll)window.scrollTo({top:document.querySelector('.nav-shell').offsetTop,behavior:'smooth'});}
function clearTrack(id){let a=document.getElementById(id);a.querySelectorAll('[data-answer]').forEach(x=>{delete state.answers[x.dataset.answer];x.value=''});a.querySelectorAll('[data-shadow]').forEach(x=>{delete state.checks[x.dataset.shadow];x.checked=false});a.querySelectorAll('[data-pron]').forEach(x=>{delete state.chosen[x.dataset.pron];x.checked=false});a.querySelectorAll('.answer-reveal').forEach(x=>x.classList.remove('show'));document.getElementById('done-'+id).classList.remove('show');save()}
function restore(){ $$('[data-answer]').forEach(x=>x.value=state.answers[x.dataset.answer]||'');$$('[data-shadow]').forEach(x=>x.checked=!!state.checks[x.dataset.shadow]);$$('[data-pron]').forEach(x=>x.checked=state.chosen[x.dataset.pron]===x.value);$$('[data-note]').forEach(x=>x.value=state.notes[x.dataset.note]||'');$$('audio').forEach(a=>{let n=state.plays[a.dataset.audio]||0;document.getElementById('plays-'+a.dataset.audio).textContent=`재생 ${n}회 · ${n} lần`})}
function updateProgress(){DATA.forEach(u=>{let total=0,done=0;u.tracks.forEach(t=>{if(t.type==='shadow'){t.lines.forEach((_,i)=>{total++;if(state.checks[key(u.unit,t.no,i)])done++})}else if(t.type==='pron'){t.items.forEach((_,i)=>{total++;if(state.chosen[key(u.unit,t.no,i)])done++})}else{let arr=t.type==='numbered'?t.items:t.qa;arr.forEach((_,i)=>{total++;if((state.answers[key(u.unit,t.no,i)]||'').trim())done++})}});let el=document.getElementById('progress-'+u.unit);if(el)el.textContent=`${done}/${total} 완료 · hoàn thành`})}
render();
</script>
</body></html>
