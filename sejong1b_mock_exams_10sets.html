<script>const ALL=[{"writing":[["저는 매운 음식을 ___ 먹어요.","못"],["친구 생일 선물을 ___ 싶어요.","사고"],["세종박물관은 공원 ___ 있어요.","앞에"],["학교에 가기 ___ 운동을 해요.","전에"],["주말에 무엇을 하는지 40~60자로 써 보세요.",""]],"listening":[{"audio":"SJ_W_1B_10_2.mp3","q":"수지 씨는 아침 일찍 어디에 가요?","opts":[["🏊","수영장"],["📚","도서관"],["🏋️","헬스클럽"]],"ans":2,"kind":"visual"},{"audio":"SJ_W_1B_06_2.mp3","q":"놀이공원에 무엇을 타고 가요?","opts":[["🚌","버스"],["🚕","택시"],["🚇","지하철"]],"ans":0,"kind":"visual"},{"audio":"SJ_W_1B_01_2.mp3","q":"유진 씨가 좋아하는 음식은 무엇이에요?","opts":[["🍜","냉면"],["🥩","불고기"],["🍚","비빔밥"]],"ans":1,"kind":"visual"},{"audio":"SJ_W_1B_08_2(1).mp3","q":"서울에서 뭐 했어요?","choices":["학교 식당에서 먹어요.","네, 다리가 아프고 허리도 많이 아파요.","불고기를 좋아해요.","맛집에도 많이 가고 한복도 입었어요."],"answer":3,"kind":"mcq"},{"audio":"SJ_W_1B_12_2.mp3","q":"안나 씨는 선물을 준비했어요?","choices":["헬스클럽에 가요.","치마 좀 보여 주세요.","아니요. 아직 준비를 못했어요.","공원 앞에 있어요."],"answer":2,"kind":"mcq"},{"audio":"SJ_W_1B_10_2.mp3","q":"수지 씨, 아침 일찍 어디에 가요?","choices":["네, 토요일에는 시간이 돼요.","한국에 갈 거예요.","네, 다리가 아프고 허리도 많이 아파요.","헬스클럽에 가요."],"answer":3,"kind":"mcq"},{"audio":"SJ_W_1B_03_2.mp3","q":"그런데 뭘 살 거예요?","choices":["네, 어제 갔지만 오늘도 가야 돼요.","토요일에 등산을 한 후에 아팠어요.","운동화를 살 거예요.","공원 앞에 있어요."],"answer":2,"kind":"mcq"},{"audio":"SJ_W_1B_05_2.mp3","q":"오른쪽으로 가면 무엇이 있어요?","choices":["운동을 좋아해요.","이번 주말에는 약속이 없어요.","공원이 있어요.","한국에 갈 거예요."],"answer":2,"kind":"mcq"},{"audio":"SJ_W_1B_04_2.mp3","q":"이 치마는 어때요?","choices":["네, 토요일에는 시간이 돼요.","토요일에 등산을 한 후에 아팠어요.","조금 짧아요.","행복 식당에서 해요."],"answer":2,"kind":"mcq"},{"audio":"SJ_W_1B_11_2.mp3","q":"반 모임은 어디에서 해요?","opts":[["☕","카페"],["🏫","학교"],["🍽️","식당"]],"ans":2,"kind":"visual"},{"audio":"SJ_W_1B_02_2.mp3","q":"재민 씨가 좋아하는 취미는 무엇이에요?","opts":[["🎣","낚시"],["🎾","테니스"],["🏀","농구"]],"ans":0,"kind":"visual"},{"audio":"SJ_W_1B_01_2.mp3","q":"안나 씨는 무슨 음식을 좋아해요?","choices":["조금 짧아요.","떡볶이를 좋아해요.","한국에 갈 거예요.","운동을 좋아해요."],"answer":1,"kind":"mcq"},{"audio":"SJ_W_1B_10_2.mp3","q":"아침은 어디에서 먹어요?","choices":["학교 식당에서 먹어요.","여덟 시에 가요.","아니요. 기타를 배우고 있어서 시간이 안 돼요.","헬스클럽에 가요."],"answer":0,"kind":"mcq"},{"audio":"SJ_W_1B_10_2.mp3","q":"보통 몇 시에 운동을 하러 가요?","choices":["학교 식당에서 먹어요.","한국에 갈 거예요.","네, 토요일에는 시간이 돼요.","여덟 시에 가요."],"answer":3,"kind":"mcq"},{"audio":"SJ_W_1B_02_2.mp3","q":"재민 씨는 취미가 뭐예요?","choices":["여덟 시에 가요.","낚시를 좋아해요.","맛집에도 많이 가고 한복도 입었어요.","오른쪽으로 가요."],"answer":1,"kind":"mcq"}],"reading":[{"type":"dialogue","instruction":"Chọn câu trả lời phù hợp với mẫu trong giáo trình.","question":"가: 아침에 아주 일찍 일어나요. 어떤 좋은 습관이 있어요?\n나: ________","choices":["공원에 가서 산책을 할 거예요.","준비 운동을 해요.","일찍 일어나요.","책을 읽어요."],"answer":2,"explanation":"Đáp án này phù hợp với mẫu câu và cách diễn đạt trong tài liệu bài học.","source":"Bài 10 1b p1.pdf / Bài 10 1b p2.pdf","lesson":10,"lesson_title":"건강한 생활과 행동 순서"},{"type":"dialogue","instruction":"Chọn câu trả lời phù hợp với mẫu trong giáo trình.","question":"가: 마트에 뭐 하러 가요?\n나: ________","choices":["과일을 사러 마트에 가요.","책을 읽으러 도서관에 가요.","노래를 부르러 노래방에 가요.","한국어를 배우러 세종학당에 가요."],"answer":0,"explanation":"Đáp án này phù hợp với mẫu câu và cách diễn đạt trong tài liệu bài học.","source":"Bài 2 1B p1.pdf / Bài 2 1B p2.pdf","lesson":2,"lesson_title":"취미와 목적"},{"type":"dialogue","instruction":"Chọn câu trả lời phù hợp với mẫu trong giáo trình.","question":"가: 점심에 뭘 먹고 싶어요?\n나: ________","choices":["치마를 사고 싶어요.","농구를 자주 해요.","김치찌개를 먹고 싶어요.","비빔밥을 먹고 싶어요."],"answer":2,"explanation":"Đáp án này phù hợp với mẫu câu và cách diễn đạt trong tài liệu bài học.","source":"Bài 1 1B.pdf","lesson":1,"lesson_title":"음식과 좋아하는 것"},{"type":"dialogue","question":"식사를 해요. 그리고 주스를 마셔요.","choices":["식사한 후에 주스를 마셔요.","주스를 마신 후에 식사를 해요.","식사를 하러 주스를 마셔요.","식사에게 주스를 줘요."],"answer":0,"explanation":"식사가 먼저, 주스가 다음이에요.","source":"24.8 Bài 8 luyện tập.pdf","lesson":8,"lesson_title":"여행 경험과 순서·비교"},{"type":"dialogue","instruction":"Chọn câu trả lời phù hợp với mẫu trong giáo trình.","question":"가: 놀이공원에 뭐 하러 가요?\n나: ________","choices":["친구를 만나러 카페에 가요.","낚시를 하러 강에 가요.","놀이공원에 놀러 가요.","노래를 부르러 노래방에 가요."],"answer":2,"explanation":"Đáp án này phù hợp với mẫu câu function timerHTML(min,id){return `<span class="timer" id="${id}t">${String(min).padStart(2,'0')}:00</span><button class="btn ghost" onclick="startTimer('${id}',${min})">Bắt đầu</button>`}let timers={};function startTimer(id,min){if(timers[id])return;let s=min*60;const el=document.getElementById(id+'t');timers[id]=setInterval(()=>{s--;el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0){clearInterval(timers[id]);el.textContent='HẾT GIỜ';}},1000)}
function setVal(k,v){state[k]=v;save()}
function renderWrite(){let h=`<div class="sectiontitle"><h2>PHẦN THI VIẾT · 5 Câu</h2><div>${timerHTML(30,'w')}</div></div><p class="vi">Câu 1~4: điền từ thích hợp. Câu 5: viết 40~60 chữ.</p>`;DATA.writing.forEach((x,i)=>{if(i<4)h+=`<div class="card"><div class="qno">Câu ${i+1}</div><div class="q">${esc(x[0])}</div><input class="input" value="${esc(state['w'+i]||'')}" oninput="setVal('w${i}',this.value)" placeholder="정답 입력"></div>`;else h+=`<div class="card"><div class="qno">Câu 5</div><div class="q">${esc(x[0])}</div><textarea oninput="setVal('w4',this.value);document.getElementById('wc').textContent=this.value.replace(/\s/g,'').length">${esc(state.w4||'')}</textarea><div class="write-count"><span id="wc">${(state.w4||'').replace(/\s/g,'').length}</span> / 40~60자</div></div>`});h+=`<div class="actions"><button class="btn primary" onclick="checkWrite()">Kiểm tra câu 1~4</button><button class="btn ghost" onclick="resetSec('w')">Làm lại</button></div><div id="wres"></div>`;document.getElementById('write').innerHTML=h}
function checkWrite(){let n=0;DATA.writing.slice(0,4).forEach((x,i)=>{let a=(state['w'+i]||'').replace(/\s/g,'');let b=x[1].replace(/\s/g,'');if(a===b)n++});document.getElementById('wres').innerHTML=`<div class="result">1~4번: ${n} / 4<br>Đáp án: ${DATA.writing.slice(0,4).map((x,i)=>i+1+'. '+x[1]).join(' · ')}</div>`}
function renderListen(){let h=`<div class="sectiontitle"><h2>PHẦN THI NGHE · 15 Câu</h2><div>${timerHTML(25,'l')}</div></div><p class="vi">1~3, 10~11: nghe và chọn hình. Các câu còn lại: nghe và chọn đáp án phù hợp.</p>`;DATA.listening.forEach((x,i)=>{let k='l'+i;h+=`<div class="card"><div class="qno">Câu ${i+1}</div><audio controls preload="none" src="${encodeURI(x.audio)}"></audio><div class="q">${esc(x.q)}</div>`;if(x.kind==='visual'){h+=`<div class="visuals">`+x.opts.map((o,j)=>`<button class="visual ${state[k]==j?'sel':''}" onclick="setVal('${k}',${j});renderListen()"><span>${o[0]}</span><small>Hình ${j+1}</small></button>`).join('')+`</div>`}else{h+=`<div class="choices">`+x.choices.map((o,j)=>`<label class="choice"><input type="radio" name="${k}" ${state[k]==j?'checked':''} onchange="setVal('${k}',${j})"><span>${j+1}. ${esc(o)}</span></label>`).join('')+`</div>`}h+=`</div>`});h+=`<div class="actions"><button class="btn primary" onclick="checkListen()">Chấm điểm nghe</button><button class="btn ghost" onclick="resetSec('l')">Làm lại</button></div><div id="lres"></div>`;document.getElementById('listen').innerHTML=h}
function checkListen(){let n=0;DATA.listening.forEach((x,i)=>{let ans=x.kind==='visual'?x.ans:x.answer;if(Number(state['l'+i])===ans)n++});document.getElementById('lres').innerHTML=`<div class="result">NGHE: ${n} / 15</div>`}
function renderRead(){let h=`<div class="sectiontitle"><h2>PHẦN THI ĐỌC · 15 Câu</h2><div>${timerHTML(25,'r')}</div></div><p class="vi">1~3 điền chỗ trống · 4~6 chọn câu trả lời · 7~8 chọn chủ đề · 9~15 đọc đoạn văn và trả lời.</p>`;DATA.reading.forEach((x,i)=>{let k='r'+i;h+=`<div class="card"><div class="qno">Câu ${i+1}</div>${x.passage?`<div class="passage">${esc(x.passage)}</div>`:''}<div class="q">${esc(x.question)}</div><div class="choices">`+x.choices.map((o,j)=>`<label class="choice"><input type="radio" name="${k}" ${state[k]==j?'checked':''} onchange="setVal('${k}',${j})"><span>${j+1}. ${esc(o)}</span></label>`).join('')+`</div></div>`});h+=`<div class="actions"><button class="btn primary" onclick="checkRead()">Chấm điểm đọc</button><button class="btn ghost" onclick="resetSec('r')">Làm lại</button></div><div id="rres"></div>`;document.getElementById('read').innerHTML=h}
function checkRead(){let n=0;DATA.reading.forEach((x,i)=>{if(Number(state['r'+i])===Number(x.answer))n++});document.getElementById('rres').innerHTML=`<div class="result">ĐỌC: ${n} / 15</div>`}
function renderSpeak(){let h=`<div class="sectiontitle"><h2>PHẦN THI NÓI · 5 Câu</h2><div>${timerHTML(3,'s')}</div></div><p class="vi">1~4: nghe và trả lời. Câu 5: nghe và trình bày suy nghĩ.</p>`;DATA.speaking.forEach((x,i)=>{let k='s'+i;h+=`<div class="card"><div class="qno">Câu ${i+1}</div><audio controls preload="none" src="${encodeURI(x.audio)}"></audio><div class="q">${esc(x.q)}</div><textarea oninput="setVal('${k}',this.value)" placeholder="말할 내용을 먼저 적어 보세요">${esc(state[k]||'')}</textarea><button class="btn ghost" onclick="document.getElementById('a${i}').style.display='block'">Xem câu trả lời mẫu</button><div class="answerbox" id="a${i}">${esc(x.model)}</div></div>`});h+=`<div class="actions"><button class="btn ghost" onclick="resetSec('s')">Làm lại phần nói</button></div>`;document.getElementById('speak').innerHTML=h}
function resetSec(p){Object.keys(state).filter(k=>k.startsWith(p)).forEach(k=>delete state[k]);save();renderAll()}function renderAll(){renderWrite();renderListen();renderRead();renderSpeak()}document.getElementById('setnav').innerHTML=[1,2,3,4,5].map(n=>`<a href="?set=${n}" style="text-decoration:none;padding:8px 12px;border-radius:999px;background:${n===SET?'white':'#ffffff33'};color:${n===SET?'#264f74':'white'};font-weight:900">Đề ${n}</a>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.getElementById('setnav').innerHTML=[1,2,3,4,5].map(n=>`<a href="?set=${n}" style="text-decoration:none;padding:8px 12px;border-radius:999px;background:${n===SET?'white':'#ffffff33'};color:${n===SET?'#264f74':'white'};font-weight:900">Đề ${n}</a>`).join('');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});renderAll();</script></body></html>
