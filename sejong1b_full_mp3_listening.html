 }else{
  body=`<div class="shadow-list">${t.lines.map((l,qi)=>`<label class="shadow-item"><input type="checkbox" data-check="${key(u.unit,t.no,qi)}"><span>${esc(l)}</span></label>`).join('')}</div>`;
 }

}
function bind(){
 $$('.tab').forEach(b=>b.onclick=()=>{ $$('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); $$('.unit').forEach(x=>x.classList.remove('active')); $(`#unit-${b.dataset.unit}`).classList.add('active'); scrollTo({top:$('.toolbar').offsetTop,behavior:'smooth'}); });
 $$('input[data-key]').forEach(el=>{el.onchange=()=>{state.answers[el.dataset.key]=el.type==='radio'?Number(el.value):el.value;save()};el.oninput=()=>{if(el.type!=='radio'){state.answers[el.dataset.key]=el.value;save()}}});

 $$('.speed').forEach(b=>b.onclick=()=>{const box=b.closest('.audio-box'),a=box.querySelector('audio');a.playbackRate=Number(b.dataset.speed);box.querySelectorAll('.speed').forEach(x=>x.classList.remove('on'));b.classList.add('on')});

function restore(){
 $$('input[data-key]').forEach(el=>{const v=state.answers[el.dataset.key];if(v!==undefined){if(el.type==='radio')el.checked=Number(el.value)===Number(v);else el.value=v}});

function showPlay(id){const e=$(`#plays-${id}`);if(e)e.textContent=`재생 ${state.plays[id]||0}회 · Đã nghe ${state.plays[id]||0} lần`}
function getTrack(id){const m=id.match(/u(\d+)t(\d+)/),u=DATA.find(x=>x.unit===Number(m[1]));return [u,u.tracks.find(x=>x.no===Number(m[2]))]}
function checkTrack(id,show=true){

}
function showResult(id,text,cls){const e=$(`#result-${id}`);e.textContent=text;e.className=`result show ${cls}`}
function clearTrack(id){const [u,t]=getTrack(id);const n=t.type==='fill'?t.lines.length:t.questions.length;for(let i=0;i<n;i++)delete state.answers[key(u.unit,t.no,i)];const root=$(`#${id}`);root.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);root.querySelectorAll('input[type=text]').forEach(x=>x.value='');root.querySelectorAll('.choice,input').forEach(x=>x.classList.remove('correct','wrong'));root.querySelectorAll('.answer-tip').forEach(x=>x.textContent='');$(`#result-${id}`).className='result';save()}
function checkAll(){let c=0,t=0,a=0;DATA.forEach(u=>u.tracks.forEach(x=>{if(x.type!=='shadow'){const r=checkTrack(`u${u.unit}t${x.no}`,false);c+=r.correct;t+=r.total;a+=r.answered}}));$('#scorebig').textContent=`총점 ${c} / ${t}`;$('#scoredetail').textContent=`답한 문항 ${a}/${t} · Đúng ${c}/${t}`;$('#scorebox').classList.add('show');updateProgress()}
function updateProgress(){DATA.forEach(u=>{let answered=0,total=0;u.tracks.forEach(t=>{if(t.type==='shadow')return;const n=t.type==='fill'?t.lines.length:t.questions.length;total+=n;for(let i=0;i<n;i++){const v=state.answers[key(u.unit,t.no,i)];if(v!==undefined&&String(v).trim()!=='')answered++}});const e=$(`#progress-${u.unit}`);if(e)e.textContent=`${answered}/${total} 완료 · hoàn thành`})}
render();
</script>
</body>
</html>
